[project]
name = "ssl-modeling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "ocp-viewer>=1.1.3",
    "ocp-vscode>=4.1.0",
    "pyvista>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sslcad", "parts", "components", "assemblies"]
